services:
  audio-summary-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-summary-worker:latest
    container_name: audio-summary-worker
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_DEVICE: cpu
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-1}
      WORKER_API_KEY: ${WORKER_API_KEY:?WORKER_API_KEY is required}
      MAX_CHARS_CEILING: ${MAX_CHARS_CEILING:-500}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-67108864}
      OMP_NUM_THREADS: ${WHISPER_CPU_THREADS:-4}
    volumes:
      - whisper-models:/models
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 3G
    restart: unless-stopped

volumes:
  whisper-models:
